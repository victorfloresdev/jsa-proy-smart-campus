<div class="card shadow-sm border-0 mb-4">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label for="busquedaRuta" class="form-label small fw-semibold mb-1">
          Buscar ruta o conductor
        </label>
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-white">
            <i class="bi bi-search text-muted"></i>
          </span>
          <input
            id="busquedaRuta"
            type="text"
            class="form-control"
            placeholder="Origen, destino, referencia o conductor..."
            [(ngModel)]="terminoBusqueda"
            (ngModelChange)="emitirFiltros()"
          />
        </div>
      </div>

      <div class="col-md-3">
        <label for="filtroTurno" class="form-label small fw-semibold mb-1">Turno</label>
        <select
          id="filtroTurno"
          class="form-select form-select-sm"
          [(ngModel)]="turno"
          (ngModelChange)="emitirFiltros()"
        >
          <option value="Todos">Todos</option>
          <option value="Mañana">Mañana</option>
          <option value="Tarde">Tarde</option>
          <option value="Noche">Noche</option>
        </select>
      </div>

      <div class="col-md-4 d-flex justify-content-md-end align-items-center gap-2">
        <span class="badge text-bg-light border">
          {{ totalResultados }} {{ totalResultados === 1 ? 'ruta encontrada' : 'rutas encontradas' }}
        </span>
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary"
          (click)="limpiarFiltros()"
        >
          <i class="bi bi-arrow-counterclockwise me-1"></i>Limpiar filtros
        </button>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-4 mt-3 pt-2 border-top">
      <div class="form-check form-switch">
        <input
          id="switchDisponibles"
          class="form-check-input"
          type="checkbox"
          role="switch"
          [(ngModel)]="soloDisponibles"
          (ngModelChange)="emitirFiltros()"
        />
        <label class="form-check-label small" for="switchDisponibles">
          Solo con asientos disponibles
        </label>
      </div>

      <div class="form-check form-switch">
        <input
          id="switchMisRutas"
          class="form-check-input"
          type="checkbox"
          role="switch"
          [(ngModel)]="soloMisRutas"
          (ngModelChange)="emitirFiltros()"
        />
        <label class="form-check-label small" for="switchMisRutas">
          Mis rutas / Mis viajes
        </label>
      </div>
    </div>
  </div>
</div>
